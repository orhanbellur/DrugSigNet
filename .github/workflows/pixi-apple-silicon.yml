name: Pixi Apple Silicon installation
on:
  push:
    branches: [codex/fix-pixi-apple-silicon]
  pull_request:
    paths:
      - install-pixi.R
      - tools/install_drugsignet_pixi.sh
      - tools/runtime-dependencies.tsv
      - tools/test_installation.R
      - .github/workflows/pixi-apple-silicon.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      DRUGSIGNET_AUTO_INSTALL_PYTHON: 'false'
      DRUGSIGNET_SKIP_SYNAPSER_INSTALL: 'true'
      DRUGSIGNET_SKIP_RUNTIME_SETUP: 'true'
      DRUGSIGNET_CI_REF: ${{ github.head_ref || github.ref_name }}
      RETICULATE_USE_MANAGED_VENV: 'no'
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Install complete Pixi runtime and build vignettes
        # Exercise isolation from a host RStudio/Java setup as well.
        env:
          JAVA_HOME: ${{ runner.temp }}/host-java-must-not-leak
          R_JAVA_LD_LIBRARY_PATH: ${{ runner.temp }}/host-java-must-not-leak/lib/server
        shell: Rscript {0}
        run: |
          source("install-pixi.R")
          install_drugsignet_pixi(
            package_ref = paste0(Sys.getenv("GITHUB_REPOSITORY"), "@", Sys.getenv("DRUGSIGNET_CI_REF")),
            project_dir = file.path(Sys.getenv("RUNNER_TEMP"), "DrugSigNet-test"),
            build_vignettes = TRUE,
            repository_root = "."
          )
      - name: Record installed R and Bioconductor versions
        run: |
          env -u R_HOME -u R_LIBS -u R_LIBS_USER -u R_LIBS_SITE \
            -u JAVA_HOME -u R_JAVA_LD_LIBRARY_PATH \
            "$HOME/.pixi/bin/pixi" run --clean-env --manifest-path "$RUNNER_TEMP/DrugSigNet-test/pixi.toml" Rscript --vanilla -e 'print(R.version.string); print(BiocManager::version()); print(installed.packages()[, c("Package", "Version")])'
