name: DrugSigNet cross-platform check
'on':
  # Run checks when a feature branch is pushed, rather than waiting until a
  # pull request targets one of the release branches below.
  push: {}
  pull_request:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
  workflow_dispatch: {}
jobs:
  rworkflows:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    env:
      R_BIOC_VERSION: ${{ matrix.config.bioc }}
      DRUGSIGNET_AUTO_INSTALL_PYTHON: 'false'
      # The complete r-drugsignet runtime is provisioned before R CMD check.
      # Prevent reticulate from independently creating an r-reticulate
      # environment (which is both redundant and vulnerable to upstream Conda
      # launcher packaging regressions on Windows).
      RETICULATE_USE_MANAGED_VENV: 'no'
      # CI containers intentionally run pip as their isolated build user.
      PIP_ROOT_USER_ACTION: ignore
      # synapser is installed for normal source installs, but package checks
      # skip this network-dependent integration and exercise guarded paths.
      DRUGSIGNET_SKIP_SYNAPSER_INSTALL: 'true'
    strategy:
      fail-fast: ${{ false }}
      matrix:
        config:
        # Bioconductor 3.22 is the release designed for R 4.5 on Linux,
        # macOS ARM64, and Windows. Keeping this pair explicit prevents the
        # action's own BiocVersion/BiocStyle dependencies from being resolved
        # against repositories for a different R/Bioconductor generation.
        - os: ubuntu-latest
          bioc: '3.22'
          # The official Bioconductor 3.22 container is built with R 4.5.2;
          # this matrix label must describe the R actually inside the image.
          r: '4.5.2'
          cont: ghcr.io/bioconductor/bioconductor_docker:RELEASE_3_22-R-4.5.2
          rspm: ~
        # R 4.4 uses its matching Bioconductor 3.20 release. Native Linux
        # exercises installation outside the recommended R 4.5 container.
        - os: ubuntu-latest
          bioc: '3.20'
          r: '4.4.3'
          cont: ~
          rspm: ~
        - os: macOS-latest
          bioc: '3.20'
          r: '4.4.3'
          cont: ~
          rspm: ~
        - os: windows-latest
          bioc: '3.20'
          r: '4.4.3'
          cont: ~
          rspm: ~
        - os: macOS-latest
          bioc: '3.22'
          r: '4.5.3'
          cont: ~
          rspm: ~
        - os: windows-latest
          bioc: '3.22'
          r: '4.5.3'
          cont: ~
          rspm: ~
    steps:
    - name: Check out repository
      uses: actions/checkout@v5
    - name: Set up R
      if: ${{ matrix.config.cont == null }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.config.r }}
        use-public-rspm: true
    - name: Set up Pandoc
      uses: r-lib/actions/setup-pandoc@v2
    - name: Set up supported Windows Python
      if: ${{ runner.os == 'Windows' }}
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Provision Windows Python modules
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        python -m pip install --disable-pip-version-check `
          numpy pandas scipy networkx joblib tqdm openpyxl jinja2 `
          markupsafe kaleido synapseclient==4.4.2
        $python = ((Get-Command python).Source -replace '\\', '/')
        "RETICULATE_PYTHON=$python" | Out-File `
          -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install Ubuntu check tools
      if: ${{ runner.os == 'Linux' }}
      run: |
        if [ "$(id -u)" -eq 0 ]; then
          apt-get update
          apt-get install --yes --no-install-recommends qpdf curl
        else
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qpdf curl
        fi
        # The Bioconductor container can retain a distro-specific Posit
        # Package Manager URL after that endpoint has been retired. Override
        # it only for this Linux job. On Windows and macOS, setup-r selects a
        # platform-aware binary repository; replacing that value globally
        # forces avoidable source installs and broke Windows dependency setup.
        if [ -n "${{ matrix.config.cont }}" ]; then
          echo "RSPM=https://cloud.r-project.org" >> "$GITHUB_ENV"
        fi
    - name: Validate CI clock before dependency setup
      if: ${{ runner.os == 'Linux' }}
      run: |
        Rscript .github/scripts/test-check-system-clock.R
        Rscript -e 'source(".github/scripts/check-system-clock.R"); check_system_clock()'
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        needs: check
        # Bioconductor 3.20 ships ggtree 3.14.0, which uses ggplot2's
        # check_linewidth helper removed in ggplot2 4.0. Use the compatible
        # pre-4.0 release while retaining the complete dependency/test graph.
        extra-packages: ${{ matrix.config.bioc == '3.20' && 'any::rcmdcheck, any::ggplot2@3.5.2' || 'any::rcmdcheck' }}
        cache-version: ${{ runner.os == 'Windows' && format('windows-{0}-{1}', github.run_id, github.run_attempt) || 'cache-v2' }}
    - id: runtime-install
      name: Install package and prepare pre-check runtime
      env:
        DRUGSIGNET_SKIP_RUNTIME_SETUP: 'true'
      shell: Rscript {0}
      run: |
        remotes::install_local(
          ".", dependencies = FALSE, upgrade = "never",
          build_vignettes = TRUE, force = TRUE
        )
        is_macos <- identical(Sys.info()[["sysname"]], "Darwin")
        if (is_macos) {
          loadNamespace("DrugSigNet")
          unexpectedly_loaded <- intersect(c("rcdk", "rJava"), loadedNamespaces())
          if (length(unexpectedly_loaded)) {
            stop(
              "DrugSigNet eagerly loaded native runtime namespaces: ",
              paste(unexpectedly_loaded, collapse = ", ")
            )
          }
          reticulate_loaded <- "reticulate" %in% loadedNamespaces()
          python_initialized <- reticulate_loaded &&
            reticulate::py_available(initialize = FALSE)
          if (python_initialized) {
            stop("DrugSigNet initialized Python while loading its namespace.")
          }
          message(
            "Validated clean DrugSigNet load on macOS before provisioning. ",
            "reticulate namespace loaded: ", reticulate_loaded,
            "; Python initialized: ", python_initialized, "."
          )
        }
        # Provision in this short-lived R process. R CMD check and testthat run
        # in fresh processes, so they inherit only the selected interpreter
        # path; they do not inherit an embedded libpython or reticulate state.
        DrugSigNet::setup_python_dependencies(write_renviron = TRUE)
    - name: Diagnose macOS R-only native state
      if: ${{ runner.os == 'macOS' }}
      shell: Rscript {0}
      run: |
        input <- data.frame(
          pert = c("drug_a", "drug_b"),
          rank_score = c(1, 0.5),
          raw_score = c(-0.8, 0.6),
          trend = c("down", "up"),
          scaled_score = c(-0.8, 0.6),
          stringsAsFactors = FALSE
        )
        direct <- dplyr::mutate(input, copied_score = raw_score)
        stopifnot(identical(direct$copied_score, input$raw_score))
        loaded_before <- loadedNamespaces()
        formatted <- DrugSigNet:::.data_format(input, score_col = "raw_score")
        stopifnot(identical(formatted$perturbation, input$pert))
        forbidden <- intersect(c("rcdk", "rJava"), loadedNamespaces())
        if (length(forbidden)) {
          stop("R-only diagnostic loaded native runtime namespaces: ",
               paste(forbidden, collapse = ", "))
        }
        reticulate_loaded <- "reticulate" %in% loadedNamespaces()
        python_initialized <- reticulate_loaded &&
          reticulate::py_available(initialize = FALSE)
        if (python_initialized) {
          stop("R-only diagnostic initialized Python before R CMD check.")
        }
        message("R-only dplyr and .data_format diagnostics passed.")
        message(
          "reticulate namespace loaded: ", reticulate_loaded,
          "; Python initialized: ", python_initialized, "."
        )
        message("Namespaces added by diagnostic: ", paste(
          setdiff(loadedNamespaces(), loaded_before), collapse = ", "
        ))
        message("Loaded DLLs before R CMD check:")
        print(getLoadedDLLs())
        print(sessionInfo())
    - id: rworkflows-check
      name: Run R CMD check
      # rworkflows v1.0.12 references the retired Catchpoint telemetry action.
      # GitHub resolves every nested action before evaluating its `if`, so
      # run_telemetry=false cannot prevent that prepare-job failure. Run the
      # same strict package check directly with maintained r-lib actions.
      continue-on-error: true
      env:
        _R_CHECK_CRAN_INCOMING_: 'false'
        RGL_USE_NULL: 'true'
      shell: Rscript {0}
      run: |
        if (identical(Sys.info()[["sysname"]], "Linux")) {
          source(".github/scripts/check-system-clock.R")
          prepare_check_clock()
        }
        rcmdcheck::rcmdcheck(
          args = c("--no-manual", "--timings", "--as-cran"),
          build_args = c("--no-manual", "--keep-empty-dirs", "--no-resave-data"),
          error_on = "note",
          check_dir = "check"
        )
    - name: Validate OS-specific runtime
      if: ${{ steps.runtime-install.outcome == 'success' }}
      run: Rscript .github/scripts/validate-runtime-install.R
    - id: check-artifacts
      name: Locate R CMD check diagnostics
      if: ${{ always() }}
      shell: Rscript {0}
      run: |
        files <- list.files(
          ".", pattern = "^(00check\\.log|testthat\\.Rout.*)$",
          recursive = TRUE, full.names = TRUE
        )
        cat(
          "found=", if (length(files)) "true" else "false", "\n",
          file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE, sep = ""
        )
        if (length(files)) {
          message("R CMD check diagnostics: ", paste(files, collapse = ", "))
        } else {
          message("No R CMD check diagnostics exist because the check did not run.")
        }
    - name: Preserve R CMD check diagnostics
      if: ${{ always() && steps.check-artifacts.outputs.found == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: r-cmd-check-${{ runner.os }}-r-${{ matrix.config.r }}
        path: |
          **/*.Rcheck/00check.log
          **/*.Rcheck/tests/testthat.Rout*
          **/check/*.Rcheck/00check.log
          **/check/*.Rcheck/tests/testthat.Rout*
    - name: Validate R CMD check result
      # A skipped check has no 00check.log. In that case the earlier failed
      # provisioning step is already the primary, actionable job failure.
      if: ${{ always() && steps.rworkflows-check.outcome != 'skipped' }}
      env:
        RWORKFLOWS_OUTCOME: ${{ steps.rworkflows-check.outcome }}
      run: Rscript .github/scripts/validate-r-cmd-check.R
