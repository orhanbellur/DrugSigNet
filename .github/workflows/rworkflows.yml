name: rworkflows
'on':
  # Run checks when a feature branch is pushed, rather than waiting until a
  # pull request targets one of the release branches below.
  push: {}
  pull_request:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
  workflow_dispatch: {}
jobs:
  rworkflows:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    env:
      DRUGSIGNET_AUTO_INSTALL_PYTHON: 'false'
      # Never let reticulate create an implicit uv environment in CI. Runtime
      # provisioning selects and persists DrugSigNet's dedicated interpreter.
      RETICULATE_USE_MANAGED_VENV: 'no'
      # CI containers intentionally run pip as their isolated build user.
      PIP_ROOT_USER_ACTION: ignore
      # synapser is installed for normal source installs, but package checks
      # skip this network-dependent integration and exercise guarded paths.
      DRUGSIGNET_SKIP_SYNAPSER_INSTALL: 'true'
    strategy:
      fail-fast: ${{ false }}
      matrix:
        config:
        # Bioconductor 3.22 is the release designed for R 4.5 on Linux,
        # macOS ARM64, and Windows. Keeping this pair explicit prevents the
        # action's own BiocVersion/BiocStyle dependencies from being resolved
        # against repositories for a different R/Bioconductor generation.
        - os: ubuntu-latest
          bioc: '3.22'
          r: '4.5.3'
          cont: ghcr.io/bioconductor/bioconductor_docker:RELEASE_3_22
          rspm: ~
        - os: macOS-latest
          bioc: '3.22'
          r: '4.5.3'
          cont: ~
          rspm: ~
        - os: windows-latest
          bioc: '3.22'
          r: '4.5.3'
          cont: ~
          rspm: ~
    steps:
    - id: rworkflows-check
      uses: neurogenomics/rworkflows@master
      # Always run the runtime diagnostics and log validator after the
      # composite action. The validator remains strict: any check warning or
      # any failure outside R CMD check still fails the job.
      continue-on-error: true
      with:
        run_bioccheck: ${{ false }}
        run_rcmdcheck: ${{ true }}
        as_cran: ${{ true }}
        run_vignettes: ${{ true }}
        has_testthat: ${{ true }}
        run_covr: ${{ true }}
        run_pkgdown: false
        run_lintr: false
        run_spelling: false
        run_telemetry: false
        has_runit: ${{ false }}
        has_latex: ${{ false }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run_docker: ${{ false }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_PATH }}
        runner_os: ${{ runner.os }}
        # Windows hosted runners have intermittently failed while extracting
        # the shared R package cache. Give each Windows run a fresh cache
        # namespace; retain the stable cache for Ubuntu and macOS.
        cache_version: ${{ runner.os == 'Windows' && format('windows-{0}-{1}', github.run_id, github.run_attempt) || 'cache-v1' }}
        docker_registry: ghcr.io
    - id: runtime-install
      name: Install package and provision complete runtime
      if: ${{ always() }}
      env:
        DRUGSIGNET_SKIP_RUNTIME_SETUP: 'true'
      run: |
        Rscript -e "remotes::install_local('.', dependencies=FALSE, upgrade='never', build_vignettes=TRUE, force=TRUE)"
        Rscript -e "DrugSigNet::setup_python_dependencies(write_renviron=TRUE)"
    - name: Validate OS-specific runtime
      if: ${{ steps.runtime-install.outcome == 'success' }}
      run: Rscript .github/scripts/validate-runtime-install.R
    - name: Validate R CMD check result
      if: ${{ always() }}
      env:
        RWORKFLOWS_OUTCOME: ${{ steps.rworkflows-check.outcome }}
      run: Rscript .github/scripts/validate-r-cmd-check.R
